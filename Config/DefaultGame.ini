; ===========================================================================
; 烘焙兜底：C++ 硬编码路径指向的「孤儿资产」
; ===========================================================================
;
; 段名用 UnrealEd 而不是 DeveloperToolSettings —— 类是编在 DeveloperToolSettings 模块里的，
; 但**配置段名必须是 UnrealEd**。实测：NNEDenoiser 插件靠
;   [/Script/UnrealEd.ProjectPackagingSettings] +DirectoriesToAlwaysCook=(Path="/NNEDenoiser")
; 生效（cook -LogCmds="LogCook Verbose" 打出 "Loading directory to always cook /NNEDenoiser"）；
; 写成 [/Script/DeveloperToolSettings.ProjectPackagingSettings] 同一行不会被读到。
;
; **为什么需要这段**：cooker 只按「引用可达性」收集资产，而从 C++ 构造函数里的裸 TEXT()
; 造出来的 FSoftObjectPath（或 ConstructorHelpers::FObjectFinder）**不进任何引用图** ——
; 引擎唯一的软引用登记入口 FRedirectCollector::OnSoftObjectPathLoaded 要求一个 FArchive*，
; 构造出来的路径永远拿不到它；CookOnTheFlyServer 的全部合法 cook 入口没有一条与 C++/CDO 有关。
; 内容浏览器改名时那句「否则烘焙版本可能缺失资产」（AssetRenameManager 的
; RenameCDOReferences）说的就是这件事。实测：没有这段兜底时，AM_IG_WuTa 与序列
; **确实不在** Saved/Cooked/ 里。
;
; 三个目录对应 2026-09-20 全库扫出的、只被 C++ 引用、Content/ 全树零 .uasset 入向引用的资产：
;   /Game/Weapons/InsectGlaive                            AM_IG_WuTa（DanceVaultMontage）
;                                                         + 4 个 AS_Unsh_Hit* 受击受身序列
;   /Game/Monster/TrainingDummy/Materials                 MI_TD_White/Orange/Red/Fire
;   /Game/Blueprints/Characters/Demo/Animation/MotionMatching
;                                                         PSD_MH_Shth_Run/Sprint_LoopOnly
; 未纳入的同类孤儿（有意为之）：4 个 AS_Shth_*_Stop_* 只被 MHGZPMMAssetFixupCommandlet /
; MHGZPMMExtendedStopCommandlet 当**生成输入**（编辑器期），运行时不需要它们。
;
; 游戏侧症状：命中失败时 StartAdvancingCounterVaultVisual() 静默 return false（跳了但没姿势，
; 不打 log），而 PIE 读散装资产，测不出来 —— 只在打包版本出现。
;
; Review/ 是明确标注为不出的候选资产（useless / UnusedCandidate 共 17 个），
; 上面的 IG 兜底按目录粒度会把它一起卷进来，这里挡掉。
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Weapons/InsectGlaive")
+DirectoriesToAlwaysCook=(Path="/Game/Monster/TrainingDummy/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints/Characters/Demo/Animation/MotionMatching")
+DirectoriesToNeverCook=(Path="/Game/Weapons/InsectGlaive/Anims/Sequences/Imported/Review")
